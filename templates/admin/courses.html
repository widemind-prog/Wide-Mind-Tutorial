{% extends "base.html" %}
{% block title %}Admin – Courses{% endblock %}
{% block content %}
<section class="admin-dashboard">
    <h1 class="dashboard-title">Courses</h1>
    <!-- ADD COURSE FORM -->
    <details class="admin-box" id="add-course-details">
        <summary style="font-weight:700; font-size:15px; cursor:pointer; color:#8B7500;">
            <i class="fa-solid fa-plus" style="margin-right:6px;"></i>Add New Course
        </summary>
        <form method="POST" action="/admin/courses/add" style="margin-top:14px;background:transparent;box-shadow:none;padding:0;">
            <div style="display:flex;gap:8px;margin-bottom:8px;">
                <select name="level" required style="flex:1;">
                    <option value="" disabled selected>Level</option>
                    <option value="300">300L</option>
                    <option value="400">400L</option>
                    <option value="500">500L</option>
                </select>
                <select name="semester" required style="flex:1;">
                    <option value="" disabled selected>Semester</option>
                    <option value="1">1st</option>
                    <option value="2">2nd</option>
                </select>
            </div>
            <input type="text" name="course_code" placeholder="Course Code (e.g. PSY501)" required>
            <input type="text" name="course_title" placeholder="Course Title" required>
            <textarea name="description" rows="2" placeholder="Description (optional)"></textarea>
            <button type="submit" style="margin-top:4px;">Add Course</button>
        </form>
    </details>
    <!-- SEARCH -->
    <div class="admin-box" style="padding:10px 14px; margin-bottom:12px;">
        <div style="display:flex; align-items:center; gap:10px;">
            <i class="fa-solid fa-magnifying-glass" style="color:#8B7500;"></i>
            <input type="text" id="course-search" placeholder="Search by code or title..."
                   style="border:none;outline:none;background:transparent;font-size:15px;
                          width:100%;margin:0;padding:6px 0;box-shadow:none;">
            <button id="course-search-clear"
                    style="display:none;background:none;border:none;cursor:pointer;
                           font-size:14px;padding:0;width:auto;margin:0;color:#aaa;">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>
    <!-- LEVEL FILTER -->
    <div class="filter-tab-bar" id="course-level-tabs" style="margin-bottom:8px;">
        <button class="filter-tab active" data-level="all">All</button>
        <button class="filter-tab" data-level="300">300L</button>
        <button class="filter-tab" data-level="400">400L</button>
        <button class="filter-tab" data-level="500">500L</button>
    </div>
    <!-- SEMESTER FILTER -->
    <div class="filter-tab-bar" style="margin-bottom:14px;">
        <button class="filter-tab-secondary active" data-sem="all">All Semesters</button>
        <button class="filter-tab-secondary" data-sem="1">1st Semester</button>
        <button class="filter-tab-secondary" data-sem="2">2nd Semester</button>
    </div>
    <div id="course-count" style="font-size:13px;color:#aaa;margin-bottom:10px;"></div>
    <div id="courses-grid"></div>
    <div id="courses-empty" style="display:none;text-align:center;padding:30px;color:#aaa;">
        No courses match this filter.
    </div>
    <a href="/admin/" class="back-login-btn" style="margin-top:16px;display:inline-block;">← Dashboard</a>
</section>
<style>
.filter-tab-bar { display:flex;gap:6px;flex-wrap:wrap; }
.filter-tab {
    padding:7px 14px;border-radius:20px;border:1.5px solid #e6d8b5;
    background:transparent;font-size:13px;font-weight:600;cursor:pointer;color:inherit;
}
.filter-tab.active {
    background:linear-gradient(135deg,#8B7500,#d4af37);color:#fff;border-color:transparent;
}
.filter-tab-secondary {
    padding:5px 12px;border-radius:20px;border:1.5px solid #e6d8b5;
    background:transparent;font-size:12px;font-weight:600;cursor:pointer;color:inherit;
}
.filter-tab-secondary.active {
    background:#3c2f1f;color:#fff;border-color:transparent;
}
.course-card { margin-bottom:10px; }
.course-card-header {
    display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;
}
.course-card-title { font-weight:700;font-size:15px; }
.course-card-code { font-size:12px;color:#8B7500;font-weight:700;margin-bottom:2px; }
.course-card-meta { font-size:12px;color:#aaa;margin-bottom:8px; }
.course-card-actions { display:flex;gap:8px;flex-wrap:wrap; }
.course-card-actions a,.course-card-actions button {
    font-size:12px;padding:6px 14px;border-radius:7px;border:none;
    cursor:pointer;font-weight:600;text-decoration:none;
}
</style>
<script>
const ALL_COURSES = {{ courses_json | safe }};
let activeLevel = "all";
let activeSem = "all";
let searchQuery = "";
function matchesCourse(c) {
    if (activeLevel !== "all" && c.level !== activeLevel) return false;
    if (activeSem !== "all" && String(c.semester) !== activeSem) return false;
    if (searchQuery) {
        const q = searchQuery.toLowerCase();
        if (!c.course_code.toLowerCase().includes(q) && !c.course_title.toLowerCase().includes(q)) return false;
    }
    return true;
}
function renderCourses() {
    const grid = document.getElementById("courses-grid");
    const empty = document.getElementById("courses-empty");
    const countEl = document.getElementById("course-count");
    grid.innerHTML = "";
    const filtered = ALL_COURSES.filter(matchesCourse);
    countEl.textContent = `${filtered.length} course${filtered.length !== 1 ? "s" : ""}`;
    // Update tab counts
    document.querySelectorAll(".filter-tab[data-level]").forEach(tab => {
        const lvl = tab.getAttribute("data-level");
        const count = ALL_COURSES.filter(c => {
            if (lvl !== "all" && c.level !== lvl) return false;
            if (activeSem !== "all" && String(c.semester) !== activeSem) return false;
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                if (!c.course_code.toLowerCase().includes(q) && !c.course_title.toLowerCase().includes(q)) return false;
            }
            return true;
        }).length;
        tab.textContent = lvl === "all" ? `All (${count})` : `${lvl}L (${count})`;
    });
    document.querySelectorAll(".filter-tab-secondary[data-sem]").forEach(tab => {
        const sem = tab.getAttribute("data-sem");
        const count = ALL_COURSES.filter(c => {
            if (activeLevel !== "all" && c.level !== activeLevel) return false;
            if (sem !== "all" && String(c.semester) !== sem) return false;
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                if (!c.course_code.toLowerCase().includes(q) && !c.course_title.toLowerCase().includes(q)) return false;
            }
            return true;
        }).length;
        tab.textContent = sem === "all" ? `All Semesters (${count})` :
                          sem === "1" ? `1st Semester (${count})` : `2nd Semester (${count})`;
    });
    if (filtered.length === 0) { empty.style.display = "block"; return; }
    empty.style.display = "none";
    filtered.forEach(c => {
        const semLabel = c.semester == 1 ? "1st" : "2nd";
        const matCount = c.material_count || 0;
        const card = document.createElement("div");
        card.className = "course-card admin-box";
        card.innerHTML = `
            <div class="course-card-header">
                <div>
                    <div class="course-card-code">${c.course_code}</div>
                    <div class="course-card-title">${c.course_title}</div>
                </div>
                <span style="font-size:11px;padding:3px 9px;border-radius:20px;
                             background:#f0e8d0;color:#8B7500;font-weight:700;white-space:nowrap;">
                    ${c.level}L · ${semLabel}
                </span>
            </div>
            ${c.is_trial ? `
            <div style="margin-bottom:6px;">
                <span style="font-size:11px;padding:3px 9px;border-radius:20px;
                             background:#0a7c2f;color:#fff;font-weight:700;">
                    <i class="fa-solid fa-star" style="margin-right:4px;"></i>Trial course (${c.level}L S${c.semester})
                </span>
            </div>` : ""}
            <div class="course-card-meta">
                ${c.description || "No description"} &nbsp;·&nbsp;
                <strong>${matCount}</strong> material${matCount !== 1 ? "s" : ""}
            </div>
            <div class="course-card-actions">
                <a href="/admin/courses/edit/${c.id}"
                   style="background:linear-gradient(135deg,#8B7500,#d4af37);color:#fff;">
                    Edit / Upload
                </a>
                <form method="POST" action="/admin/courses/set-trial/${c.id}"
                      style="margin:0;padding:0;background:none;box-shadow:none;"
                      ${c.is_trial ? `onsubmit="return confirm('Remove ${c.course_code} as the trial course for ${c.level}L S${c.semester}?')"` :
                                     `onsubmit="return confirm('Make ${c.course_code} the trial course for ${c.level}L S${c.semester}? Any existing trial course for that level+semester will be replaced.')"`}>
                    <button type="submit" style="background:${c.is_trial ? '#856404' : '#3c2f1f'};color:#fff;">
                        ${c.is_trial ? "Unset Trial" : "Set as Trial"}
                    </button>
                </form>
                <form method="POST" action="/admin/courses/delete/${c.id}"
                      onsubmit="return confirm('Delete ${c.course_code}?')"
                      style="margin:0;padding:0;background:none;box-shadow:none;">
                    <button type="submit" style="background:#a00000;color:#fff;">Delete</button>
                </form>
            </div>
        `;
        grid.appendChild(card);
    });
}
document.querySelectorAll(".filter-tab[data-level]").forEach(tab => {
    tab.addEventListener("click", () => {
        document.querySelectorAll(".filter-tab[data-level]").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        activeLevel = tab.getAttribute("data-level");
        renderCourses();
    });
});
document.querySelectorAll(".filter-tab-secondary[data-sem]").forEach(tab => {
    tab.addEventListener("click", () => {
        document.querySelectorAll(".filter-tab-secondary[data-sem]").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        activeSem = tab.getAttribute("data-sem");
        renderCourses();
    });
});
const searchInput = document.getElementById("course-search");
const searchClear = document.getElementById("course-search-clear");
let debounce;
searchInput.addEventListener("input", () => {
    searchQuery = searchInput.value.trim();
    searchClear.style.display = searchQuery ? "inline" : "none";
    clearTimeout(debounce);
    debounce = setTimeout(renderCourses, 200);
});
searchClear.addEventListener("click", () => {
    searchInput.value = "";
    searchQuery = "";
    searchClear.style.display = "none";
    renderCourses();
});
renderCourses();
</script>
<div id="admin-toast" class="toast"></div>
<script src="/static/js/admin.js"></script>
{% endblock %}
