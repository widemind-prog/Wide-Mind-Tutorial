{% extends "base.html" %}
{% block title %}Courses | Wide Mind Tutorial{% endblock %}

{% block content %}
<section class="account-section">

    <!-- SEARCH BOX — uses existing form/input styles -->
    <div class="courses-box" style="padding: 12px 16px;">
        <div style="display:flex; align-items:center; gap:10px;">
            <i class="fa-solid fa-magnifying-glass" style="color:#8B7500; font-size:15px; flex-shrink:0;"></i>
            <input
                type="text"
                id="course-search"
                placeholder="Search courses..."
                autocomplete="off"
                style="margin:0; padding:8px 4px; border:none; box-shadow:none;
                       background:transparent; font-size:15px; width:100%;"
            >
            <button id="clear-search"
                    style="display:none; background:none; border:none; padding:0;
                           margin:0; cursor:pointer; font-size:14px; width:auto;">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- COURSES LIST -->
    <div id="courses-loading" class="courses-box" style="text-align:center; color:#aaa;">
        Loading courses...
    </div>

    <div id="courses-list" style="width:95%; max-width:340px;"></div>

    <div id="courses-empty" class="courses-box" style="display:none; text-align:center; color:#aaa;">
        No courses found.
    </div>

    <!-- RERUN PASS SECTION — 400L/500L paid only, shown by JS -->
    <div id="rerun-pass-section" style="display:none; width:95%; max-width:340px;">
        <div class="courses-box">
            <h3>🔁 Rerun Passes</h3>
            <p>Pay once to unlock all courses from a lower level in your current semester.</p>
            <div id="rerun-pass-cards"></div>
        </div>
    </div>

</section>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const searchInput = document.getElementById("course-search");
    const clearBtn = document.getElementById("clear-search");
    const coursesList = document.getElementById("courses-list");
    const coursesLoading = document.getElementById("courses-loading");
    const coursesEmpty = document.getElementById("courses-empty");
    const toastEl = document.getElementById("toast");
    const rerunSection = document.getElementById("rerun-pass-section");
    const rerunCards = document.getElementById("rerun-pass-cards");

    let isPaid = false;
    let userLevel = 0;
    let rerunPassStatus = {};
    let debounceTimer = null;

    function showToast(msg, isError = false) {
        toastEl.textContent = msg;
        toastEl.className = "toast show";
        if (isError) toastEl.style.background = "crimson";
        else toastEl.style.background = "";
        setTimeout(() => { toastEl.className = "toast"; toastEl.style.background = ""; }, 3500);
    }

    async function loadUserInfo() {
        try {
            const res = await fetch("/api/auth/me", { credentials: "same-origin" });
            if (!res.ok) return;
            const u = await res.json();
            userLevel = parseInt(u.level);
        } catch(e) {}
    }

    async function loadPaymentStatus() {
        try {
            const res = await fetch("/api/payment/status", { credentials: "same-origin" });
            if (!res.ok) return;
            const data = await res.json();
            isPaid = (data.status === "paid" || data.status === "admin");
        } catch(e) {}
    }

    async function loadRerunPasses() {
        if (userLevel < 400 || !isPaid) return;
        try {
            const res = await fetch("/api/payment/rerun/status", { credentials: "same-origin" });
            if (!res.ok) return;
            const data = await res.json();
            if (!data.passes || data.passes.length === 0) return;

            rerunSection.style.display = "block";
            rerunCards.innerHTML = "";

            data.passes.forEach(pass => {
                rerunPassStatus[pass.rerun_level] = pass.status;
                const purchased = pass.status === "paid";

                // Build card using existing .courses-box inner list style
                const card = document.createElement("div");
                card.style.cssText = "border-top: 1px solid #eee; padding: 14px 0;";
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong>🔁 ${pass.rerun_level}L Rerun Pass</strong>
                        <span style="font-size:13px; color:${purchased ? 'green' : '#aaa'};">
                            ${purchased ? '✅ Active' : 'Not purchased'}
                        </span>
                    </div>
                    <p style="margin:4px 0 8px; font-size:13px;">
                        ${purchased
                            ? `All ${pass.rerun_level}L courses this semester are unlocked`
                            : `Unlock all ${pass.rerun_level}L courses this semester`}
                    </p>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong style="color:#8B7500; font-size:16px;">${pass.amount_display}</strong>
                        ${!purchased
                            ? `<button class="btn btn-pay-now btn-rerun-buy"
                                       data-level="${pass.rerun_level}"
                                       style="width:auto; padding:8px 18px; font-size:13px; margin:0;">
                                   Buy Pass
                               </button>`
                            : ''}
                    </div>
                `;
                rerunCards.appendChild(card);
            });

            // Buy handlers
            document.querySelectorAll(".btn-rerun-buy").forEach(btn => {
                btn.addEventListener("click", async () => {
                    const level = btn.getAttribute("data-level");
                    btn.disabled = true;
                    btn.textContent = "Initializing...";
                    try {
                        const res = await fetch("/api/payment/rerun/init", {
                            method: "POST",
                            credentials: "same-origin",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ rerun_level: level })
                        });
                        const d = await res.json();
                        if (d.status && d.data && d.data.authorization_url) {
                            window.location.href = d.data.authorization_url;
                        } else {
                            showToast(d.error || "Payment failed ❌", true);
                            btn.disabled = false;
                            btn.textContent = "Buy Pass";
                        }
                    } catch(e) {
                        showToast("Payment initiation failed ❌", true);
                        btn.disabled = false;
                        btn.textContent = "Buy Pass";
                    }
                });
            });
        } catch(e) {}
    }

    function renderCourses(courses) {
        coursesList.innerHTML = "";
        coursesLoading.style.display = "none";

        if (!courses || courses.length === 0) {
            coursesEmpty.style.display = "block";
            return;
        }
        coursesEmpty.style.display = "none";

        // Group by level
        const groups = {};
        courses.forEach(c => {
            if (!groups[c.level]) groups[c.level] = [];
            groups[c.level].push(c);
        });

        // Own level first (descending)
        const sortedLevels = Object.keys(groups).sort((a, b) => b - a);

        sortedLevels.forEach(lvl => {
            const isOwnLevel = groups[lvl][0].is_own_level;
            const hasRerunPass = rerunPassStatus[lvl] === "paid";
            const semLabel = groups[lvl][0].semester === 1 ? "1st" : "2nd";

            // Group box
            const box = document.createElement("div");
            box.className = "courses-box";
            box.style.marginBottom = "12px";

            // Group heading
            const heading = document.createElement("h3");
            heading.style.cssText = "font-size:13px; margin-bottom:10px;";
            heading.textContent = isOwnLevel
                ? `${lvl}L — ${semLabel} Semester`
                : `🔁 ${lvl}L — ${semLabel} Semester (Rerun)`;
            box.appendChild(heading);

            // Course list
            const ul = document.createElement("ul");
            ul.style.listStyle = "none";
            ul.style.padding = "0";
            ul.style.margin = "0";

            groups[lvl].forEach(course => {
                const li = document.createElement("li");
                li.style.cssText = "padding:10px 0; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;";

                const canAccess = isOwnLevel ? isPaid : hasRerunPass;

                if (canAccess) {
                    li.innerHTML = `
                        <a href="/course/${course.id}"
                           style="text-decoration:none; flex:1; color:inherit;">
                            <div style="font-size:12px; color:#8B7500; font-weight:700;">${course.code}</div>
                            <div style="font-size:14px; font-weight:600;">${course.title}</div>
                        </a>
                        <i class="fa-solid fa-chevron-right" style="color:#ccc; font-size:12px;"></i>
                    `;
                } else {
                    const lockMsg = isOwnLevel
                        ? "Complete payment to access"
                        : `Buy ${lvl}L Rerun Pass to access`;
                    li.style.opacity = "0.55";
                    li.style.cursor = "pointer";
                    li.innerHTML = `
                        <div style="flex:1;">
                            <div style="font-size:12px; color:#8B7500; font-weight:700;">${course.code}</div>
                            <div style="font-size:14px; font-weight:600;">${course.title}</div>
                        </div>
                        <i class="fa-solid fa-lock" style="color:#aaa; font-size:12px;"></i>
                    `;
                    li.addEventListener("click", () => {
                        showToast(lockMsg, true);
                        if (!isOwnLevel && isPaid) {
                            rerunSection.scrollIntoView({ behavior: "smooth" });
                        }
                    });
                }

                // Remove border on last item
                li.addEventListener("DOMNodeInserted", () => {});
                ul.appendChild(li);
            });

            // Remove last li border
            if (ul.lastChild) ul.lastChild.style.borderBottom = "none";

            box.appendChild(ul);
            coursesList.appendChild(box);
        });
    }

    async function fetchCourses(query = "") {
        try {
            const url = query
                ? `/api/courses/search?q=${encodeURIComponent(query)}`
                : `/api/courses/search`;
            const res = await fetch(url, { credentials: "same-origin" });
            if (!res.ok) { coursesLoading.style.display = "none"; return; }
            const data = await res.json();
            renderCourses(data.courses);
        } catch(e) {
            coursesLoading.style.display = "none";
            coursesEmpty.style.display = "block";
        }
    }

    searchInput.addEventListener("input", () => {
        const val = searchInput.value.trim();
        clearBtn.style.display = val ? "inline" : "none";
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => fetchCourses(val), 300);
    });

    clearBtn.addEventListener("click", () => {
        searchInput.value = "";
        clearBtn.style.display = "none";
        fetchCourses("");
    });

    // Init — order matters: user info first, then payment, then render
    await loadUserInfo();
    await loadPaymentStatus();
    await fetchCourses();
    await loadRerunPasses();
});
</script>
{% endblock %}
